<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Author: Cordeiro M. S.,
    Illustrator: Rocketseat, Category: Temporizador estilo pomodoro">
  <title>FocusTimer - Pomodoro</title>

  <link rel="shortcut icon" href="./assets/favicon.svg" type="image/x-svg
  ">
  <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app" class="no-select">
    <!-- <button id="toggle-mode">
      <span>Ativar/Desativar Light Mode</span>
      <i class="ph ph-bold ph-sun"></i>
      <i class="ph ph-bold ph-moon"></i>
    </button> -->

    <section id="timer"class="flex">
      <span class="minutes">02</span>
      <span>:</span>
      <span class="seconds">00</span>
    </section>

    <section id="controls" class="flex">
      <button class="ph ph-play-circle">
      </button>
      <button class="ph ph-pause-circle">
      </button>
      <button class="ph ph-timer secondary">
      </button>
      <button class="ph ph-stop-circle secondary">
      </button>
      <button class="ph ph-speaker-none secondary">
      </button>
      <button class="ph ph-speaker-high">
      </button>
    </section>
  </div>

  <!-- <script src="./js/index.js" type="module"></script> -->
</body>
</html>
