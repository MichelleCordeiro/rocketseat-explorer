<!DOCTYPE html>
<html lang="pt-br" class=" music-on">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Author: Cordeiro M. S.,
    Illustrator: Rocketseat, Category: Temporizador estilo pomodoro">
  <title>FocusTimer - Pomodoro</title>

  <link rel="shortcut icon" href="./assets/favicon.svg" type="image/x-svg">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
  />
  <script type="module" src="./scr/main.js" defer></script>
</head>
<body>
  <div id="app" class="no-select">
    <button id="toggle-mode">
      <span class="sr-only">Ativar light mode</span>
      <i class="ph ph-bold ph-sun"></i>
      <i class="ph ph-bold ph-moon"></i>
    </button>

    <section id="timer"class="flex">
      <span id="minutes">02</span>
      <span>:</span>
      <span id="seconds">00</span>
    </section>

    <section id="controls" class="flex">
      <button
        data-action="toggleRunning"
        class="ph ph-play-circle"
      >
        <span class="sr-only">Iniciar temporizador</span>
      </button>
      <button
        data-action="toggleRunning"
        class="ph ph-pause-circle"
      >
        <span class="sr-only">Pausar temporizador</span>
      </button>
      <button
        data-action="set"
        class="ph ph-timer secondary"
      >
        <span class="sr-only">Ajustar temporizador</span>
      </button>
      <button
        data-action="reset"
        class="ph ph-stop-circle secondary"
      >
        <span class="sr-only">Parar temporizador</span>
      </button>
      <button
        data-action="toggleMusic"
        class="ph ph-speaker-none secondary"
      >
        <span class="sr-only">Iniciar música</span>
      </button>
      <button
        data-action="toggleMusic"
        class="ph ph-speaker-high"
      >
        <span class="sr-only">Parar música</span>
      </button>
    </section>
  </div>
</body>
</html>
